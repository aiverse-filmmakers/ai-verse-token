name: Pricing Transactionality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pricing-transactionality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Prove failure-atomic pricing batch publication, sync truth and recovery
        run: node --test test/pricing-transactionality.test.mjs test/pricing-sync-transactionality.test.mjs
